# lazymux detection rules for Claude Code (format: see internal/agent/rules.go).
# Copy to ~/.config/lazymux/agent-detection/claude.toml to change them.
id = "claude"
version = "2026.11.12.1"
min_engine_version = 1
aliases = ["claude-code"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(15)"
visible_blocker = true
# the selected first option of a permission prompt: "❯ 1. Yes"
line_regex = ['^\s*[│┃|]?\s*[❯›>●▶▸]\s*1[.)]\s+(Yes|Allow|Approve|Proceed)']

[[rules]]
id = "question_form"
state = "blocked"
priority = 880
region = "after_last_horizontal_rule"
visible_blocker = true
# a question (AskUserQuestion) or another form waiting for an answer:
# "Enter to select · ↑/↓ to navigate · Esc to cancel"
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["to navigate"] },
    { contains = ["arrow keys"] },
  ] },
]

[[rules]]
id = "title_spinner"
state = "working"
priority = 600
region = "osc_title"
visible_working = true
# Claude Code animates its terminal title while a turn runs: braille dots
# (up to 2.1.227) or half circles (2.1.228+). An idle title starts with ✳.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "spinner_line"
state = "working"
priority = 500
region = "bottom_non_empty_lines(10)"
visible_working = true
# "✽ Philosophizing… (1m 29s · ↓ 5.6k tokens)"
line_regex = ['^\s*[·✢✳✶✻✽*⏺]\s+\S+…\s*\(']

[[rules]]
id = "interrupt_hint"
state = "working"
priority = 500
region = "bottom_non_empty_lines(10)"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["esc to cancel"] },
  { contains = ["ctrl+c to interrupt"] },
]
# menus, forms and dialogs (model picker, questions, /usage, /status) say
# "esc to cancel" too, but they wait for you; a dialog's footer is the hint
# alone on its line
not = [
  { line_regex = ['(?i)^\s*esc to (cancel|close|exit)\s*$'] },
  { contains = ["enter to select"] },
  { contains = ["enter to confirm"] },
  { contains = ["enter to set as default"] },
]

[[rules]]
id = "background_agent"
state = "working"
priority = 500
region = "after_last_horizontal_rule"
visible_working = true
# the main turn has ended (idle title) but a subagent still runs: Claude
# lists it under the prompt box with its run time and tokens
# "◯ Explore  Investigate window-close focus bug   20s · ↓ 31.6k tokens"
line_regex = ['^\s*\S\s+\S+\s{2,}\S.*\s\d+[smh](\s+\d+[smh])*\s*·\s*[↓↑]\s*[\d.]+[kKmM]?\s+tokens\s*$']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
# the ctrl+o transcript hides the live screen: keep the last state
contains = ["showing detailed transcript"]

[[rules]]
id = "title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']
